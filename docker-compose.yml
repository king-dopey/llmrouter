services:
  fastapi-router:
    build:
      context: ./
      dockerfile: Dockerfile
    image: local/ollama-openai-router:0.1.0
    container_name: ollama-openai-router
    restart: unless-stopped
    env_file:
      - profiles/router.env
      - profiles/jetson/${HARDWARE_PROFILE:-orin}.env
    volumes:
      - ${HF_CACHE_HOST_PATH:-./data/hf_cache}:/data/hf_cache
      - ${HEADROOM_CCR_STORE_HOST_PATH:-./data/headroom_ccr}:/data/headroom_ccr
      - ./profiles/${HARDWARE_PROFILE:-orin}/models.yaml:/app/model_policy.yml:ro
    ports:
      - "${ROUTER_BIND_IP:-0.0.0.0}:${ROUTER_PORT:-4000}:${ROUTER_INTERNAL_PORT:-4000}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${ROUTER_INTERNAL_PORT:-4000}/healthz', timeout=3)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:latest}
    container_name: qdrant
    restart: unless-stopped
    env_file:
      - profiles/qdrant.env
      - profiles/jetson/${HARDWARE_PROFILE:-orin}.env
    volumes:
      - ${QDRANT_STORAGE_HOST_PATH:-./data/qdrant_storage}:/qdrant/storage
    ports:
      - "${ROUTER_BIND_IP:-0.0.0.0}:${QDRANT_PORT:-6333}:6333"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:6333/healthcheck >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          memory: ${QDRANT_MEMORY_LIMIT:-4G}
