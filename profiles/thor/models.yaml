# Thor 128 GB model policy
#
# This file is tuned for real-world local use on Thor, where large-context coding,
# planning, and multi-stage agent workflows are practical, but model choice still
# strongly affects latency, loop risk, and cost.
#
# ---------------------------------------------------------------------------
# Zoo Code mode routing guidance
# ---------------------------------------------------------------------------
# Recommended default mode mapping:
#
#   architect             -> qwen3.8:27b-bf16
#   debug                 -> qwen3.8:27b-bf16
#   code                  -> qwen3.6:35b-a3b-q8_0
#   tester                -> qwen3.6:35b-a3b-q8_0
#   reviewer              -> qwen3.6:35b-a3b-q8_0
#   security-review       -> granite4.1-guardian:8b-q6_K
#   documentation-writer  -> qwen3.6:35b-a3b-q8_0
#
# Why this mapping:
#   - qwen3.6 is the best default balance for standard coding, planning, review,
#     documentation, and normal agent-loop work.
#   - qwen3.8:27b-bf16 is reserved for the two highest-cost reasoning roles:
#       * architect: structural decomposition, plan quality, repo-wide reasoning
#       * debug: failure diagnosis, root-cause isolation, ambiguous regressions
#   - granite4.1-guardian is the preferred policy/security gate.
#
# Optional alternate recommendation:
#   If debug latency becomes too high in live use, switch:
#     debug -> qwen3.8:27b-q8_0
#   and keep bf16 only for architect or explicit manual escalation.
#   This usually preserves strong reasoning while reducing runtime cost.
#
# ---------------------------------------------------------------------------
# Operational model priorities
# ---------------------------------------------------------------------------
# Primary default:
#   qwen3.6:35b-a3b-q8_0
#     - standard coding
#     - implementation
#     - routine planning
#     - debugging follow-through
#     - review
#     - documentation
#
# High-reasoning escalation:
#   qwen3.8:27b-q8_0
#     - hard coding
#     - difficult repo reasoning
#     - cheaper/faster than bf16
#
# Quality-first escalation:
#   qwen3.8:27b-bf16
#     - architect
#     - debug
#     - important manual escalations
#     - complex planning where latency is acceptable
#
# Supporting roles:
#   qwen3-coder-next:q4_K_M   -> direct edit / parser-stable / low-overbuild fallback
#   qwen3-embedding:8b        -> always-hot indexing / code search
#   granite4.1-guardian:8b-q6_K -> security gate
#
# Experimental / fallback models:
#   laguna-xs-2.1:q4_K_M      -> alternate only; high loop risk
#   gemma4 / devstral / north-mini-code / gpt-oss / nemotron
#                              retained as alternates, comparisons, or niche fallbacks
#
# ---------------------------------------------------------------------------
# Context management policy
# ---------------------------------------------------------------------------
# This router uses Headroom as the primary context-management layer.
#
# Rules:
#   - baseline compression runs on every request
#   - proactive summarization must trigger as late as safely possible
#   - early summarization is considered a failure mode
#   - dropping/segment stripping is absolute last-resort overflow recovery only
#
# Effective input budget:
#   effective_input_budget = num_ctx - reserved_output_tokens - safety_headroom_tokens
#
# Threshold policy used here:
#   - standard text/code/reasoning models:
#       proactive threshold = effective_input_budget - max(1024, ceil(effective_input_budget * 0.02))
#   - vision models:
#       proactive threshold = effective_input_budget - ceil(effective_input_budget * 0.05)
#   - embedding models:
#       proactive summarization disabled
#
# For the currently tuned Thor values, this yields:
#   qwen3.6:35b-a3b-q8_0   -> num_ctx 262144, threshold 240844
#   qwen3.8:27b-q8_0       -> num_ctx 262144, threshold 240844
#   qwen3.8:27b-bf16       -> num_ctx 262144, threshold 240844
#   qwen3-coder-next       -> num_ctx 131072, threshold 120422
#   laguna-xs-2.1          -> num_ctx 131072, threshold 120422
#
# Zoo Code interaction note:
#   Zoo should use the true context windows defined in this policy (no inflation).
#   When Zoo emits a condense trigger, the router intercepts that request and runs
#   Headroom-based condensation/recovery so router policy remains authoritative.
#
# ---------------------------------------------------------------------------
# Performance notes
# ---------------------------------------------------------------------------
# Rough practical planning multipliers relative to qwen3.6 baseline:
#   qwen3.6:35b-a3b-q8_0      = 1.0x
#   qwen3-coder-next:q4_K_M   = ~0.9x to 1.4x
#   laguna-xs-2.1:q4_K_M      = ~1.0x to 2.0x (high loop risk)
#   qwen3.8:27b-q8_0          = ~4x to 8x task-time
#   qwen3.8:27b-bf16          = ~8x to 15x task-time
#   qwen3.8:27b-bf16 runaway  = ~15x to 30x worst case if reasoning is not bounded
#
# Important:
#   Thor can run the large models, but automation should still prefer qwen3.6 for
#   normal flow and use qwen3.8 deliberately for reasoning-heavy roles.

models:
  # Primary default model
  # Use for:
  #   - discovery of complexity
  #   - easy standard script tasks
  #   - standard agent loop coding
  #   - standard planning
  #   - debugging
  #   - documentation
  #   - quality review
  - model: qwen3.6:35b-a3b-q8_0
    keep_alive: -1
    think: true
    tool_call_think: false
    retry_on_tool_call_failure: true
    retry_temperature: 0.1
    warmup: true
    reserved_output_tokens: 8192
    safety_headroom_tokens: 8192
    proactive_summarization_enabled: true
    proactive_summarization_threshold_tokens: 240844
    recovery_strategy: summarize_history
    options:
      num_ctx: 262144
      num_batch: 384
      temperature: 0.18
      top_p: 0.90
      repeat_penalty: 1.03

  # A/B candidate for Python/MCP implementation work
  # Coding-specialized variant for comparison with qwen3.6:35b-a3b-q8_0
  - model: qwen3.6:35b-a3b-coding
    keep_alive: 15m
    think: true
    tool_call_think: false
    retry_on_tool_call_failure: true
    retry_temperature: 0.1
    warmup: false
    reserved_output_tokens: 8192
    safety_headroom_tokens: 8192
    proactive_summarization_enabled: true
    proactive_summarization_threshold_tokens: 240844
    recovery_strategy: summarize_history
    options:
      num_ctx: 262144
      num_batch: 320
      temperature: 0.15
      top_p: 0.90
      repeat_penalty: 1.03

  # Primary code-search / indexing model
  # Always hot because indexing/search is continuous.
  # Native embedding dimension for 8b is 4096.
  - model: qwen3-embedding:8b
    keep_alive: -1
    think: false
    warmup: true
    reserved_output_tokens: 2048
    safety_headroom_tokens: 2048
    proactive_summarization_threshold_tokens: 0
    recovery_strategy: drop_oldest
    options:
      num_ctx: 40960
      num_batch: 512

  # Main escalation model for:
  #   - complex agent loop coding
  #   - complex planning
  #   - multi-level planning
  #   - difficult repo reasoning
  #
  # Intentionally not pinned forever:
  #   use as the main "hard task" upgrade over qwen3.6,
  #   but avoid making it the default for every coding loop.
  #
  #   keep reasoning conservative/medium for most tasks.
  - model: qwen3.8:27b-q8_0
    keep_alive: 45m
    think: true
    tool_call_think: false
    retry_on_tool_call_failure: true
    retry_temperature: 0.1
    warmup: false
    reserved_output_tokens: 8192
    safety_headroom_tokens: 8192
    proactive_summarization_enabled: true
    proactive_summarization_threshold_tokens: 240844
    recovery_strategy: drop_oldest_then_summarize
    options:
      num_ctx: 262144
      num_batch: 320
      temperature: 0.15
      top_p: 0.90
      repeat_penalty: 1.03
  # Explicit quality-first model
  # Use only for:
  #   - hard manual escalations
  #   - important complex planning
  #   - difficult code generation when longer runtime is acceptable
  #
  # Not recommended as the default automation model.
  # In practice, pair with router-side bounded reasoning.
  - model: qwen3.8:27b-bf16
    keep_alive: 15m
    think: true
    tool_call_think: false
    retry_on_tool_call_failure: true
    retry_temperature: 0.1
    warmup: false
    reserved_output_tokens: 8192
    safety_headroom_tokens: 8192
    proactive_summarization_enabled: true
    proactive_summarization_threshold_tokens: 240844
    recovery_strategy: summarize_history
    options:
      num_ctx: 262144
      num_batch: 192
      temperature: 0.12
      top_p: 0.90
      repeat_penalty: 1.03

  # Direct-edit / no-think coding fallback
  # Good when:
  #   - the task is straightforward
  #   - parser-stable output matters
  #   - overbuilding must be minimized
  #
  # Kept active but deprecated as a primary coder.
  - model: qwen3-coder-next:q4_K_M
    keep_alive: 30m
    think: false
    tool_call_think: false
    retry_on_tool_call_failure: true
    retry_temperature: 0.1
    warmup: false
    reserved_output_tokens: 4096
    safety_headroom_tokens: 4096
    proactive_summarization_enabled: true
    proactive_summarization_threshold_tokens: 120422
    recovery_strategy: drop_oldest_then_summarize
    options:
      num_ctx: 131072
      num_batch: 256
      temperature: 0.10
      top_p: 0.90
      repeat_penalty: 1.05

  # Demoted experimental coding alternative
  # Retained only for A/B and explicit alternate-behavior tests.
  # Developer/operator feedback indicates high loop risk in this environment.
  - model: laguna-xs-2.1:q4_K_M
    keep_alive: 15m
    think: true
    warmup: false
    reserved_output_tokens: 4096
    safety_headroom_tokens: 4096
    proactive_summarization_enabled: true
    proactive_summarization_threshold_tokens: 120422
