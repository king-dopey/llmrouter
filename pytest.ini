[pytest]
minversion = 7.0
addopts = -v --tb=short
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers for headroom compression modes
markers =
    base: Tests for base compression (headroom-ai without extras)
    code: Tests for code compression ([code] extra with tree-sitter)
    relevance: Tests for relevance scoring ([relevance] extra with fastembed)
    compression: Tests for compression pipeline functionality
    error_handling: Tests for error handling scenarios
    integration: Integration tests for full pipelines

# Custom markers for other modules
    tokenizer: Tests for token counting and estimation
    policy: Tests for think policy configuration and evaluation
    retrieval: Tests for Qdrant-based context retrieval
    embeddings: Tests for embedding generation endpoints
    streaming: Tests for SSE streaming and tool call translation
    usage: Tests for usage tracking and token counting in responses
    payload: Tests for Ollama payload building
    asr: Tests for automatic speech recognition endpoints
    models: Tests for model lifecycle (pull, warmup, preflight)
    serialization: Tests for tool argument serialization/deserialization edge cases

# Test group markers for filtering
filterwarnings =
    ignore::pytest.PytestUnraisableExceptionWarning
